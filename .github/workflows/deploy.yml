name: Deploy to GitHub Pages

on:
  push:
    branches:
      - develop  # Only deploy when changes hit main

permissions:
  contents: read
  pages: write      # Required for GH Pages
  id-token: write   # Required for GH Pages

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build # Docusaurus builds to the /build folder by default

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
